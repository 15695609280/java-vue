<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑单车</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2b3a; font-family: "Microsoft YaHei", sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  svg { width: min(96vw, 1000px); height: auto; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  h1 { color: #f5e9d3; margin: 0; font-weight: 600; letter-spacing: 4px; }
  .ctrl { color: #cfd8e3; display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>鹈鹕骑单车</h1>
  <svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7cc4ef"/>
        <stop offset="1" stop-color="#e8f6ff"/>
      </linearGradient>
      <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#f7c948"/>
        <stop offset="1" stop-color="#ef9b2d"/>
      </linearGradient>
      <radialGradient id="bodyG" cx=".4" cy=".35" r=".7">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#dcd6c8"/>
      </radialGradient>
    </defs>

    <!-- 天空与太阳 -->
    <rect width="800" height="500" fill="url(#sky)"/>
    <circle cx="690" cy="80" r="42" fill="#ffe27a"/>
    <circle cx="690" cy="80" r="56" fill="#ffe27a" opacity=".25"/>

    <!-- 云 -->
    <g id="clouds" fill="#fff" opacity=".9">
      <g class="cloud" data-speed="0.3">
        <ellipse cx="120" cy="80" rx="45" ry="18"/><ellipse cx="150" cy="68" rx="30" ry="20"/><ellipse cx="95" cy="72" rx="22" ry="14"/>
      </g>
      <g class="cloud" data-speed="0.5">
        <ellipse cx="450" cy="120" rx="55" ry="20"/><ellipse cx="480" cy="105" rx="34" ry="22"/><ellipse cx="420" cy="110" rx="25" ry="15"/>
      </g>
      <g class="cloud" data-speed="0.2">
        <ellipse cx="760" cy="170" rx="40" ry="14"/><ellipse cx="785" cy="160" rx="25" ry="16"/>
      </g>
    </g>

    <!-- 远山 -->
    <path d="M0 400 Q120 300 240 380 T480 360 T720 370 T800 360 V440 H0Z" fill="#8fc98a"/>
    <path d="M0 420 Q160 360 320 410 T640 400 T800 410 V440 H0Z" fill="#6fb46b"/>

    <!-- 地面 -->
    <rect y="440" width="800" height="60" fill="#5b5f66"/>
    <rect y="436" width="800" height="6" fill="#3d4046"/>
    <line id="roadDash" x1="0" y1="472" x2="800" y2="472" stroke="#f2e6b8" stroke-width="5" stroke-dasharray="40 30"/>

    <!-- 影子 -->
    <ellipse cx="400" cy="442" rx="230" ry="8" fill="#000" opacity=".25"/>

    <g id="rider">
      <!-- 远侧腿和踏板 -->
      <path id="legFar" fill="none" stroke="#d9772b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon id="footFar" fill="#d9772b"/>
      <line id="crankFar" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <rect id="pedalFar" width="22" height="6" rx="2" fill="#444"/>

      <!-- 车轮 -->
      <g id="wheelRear">
        <circle cx="250" cy="360" r="80" fill="none" stroke="#222" stroke-width="10"/>
        <circle cx="250" cy="360" r="73" fill="none" stroke="#aaa" stroke-width="3"/>
        <g class="spokes" stroke="#bbb" stroke-width="1.6"></g>
        <circle cx="250" cy="360" r="8" fill="#666"/>
      </g>
      <g id="wheelFront">
        <circle cx="550" cy="360" r="80" fill="none" stroke="#222" stroke-width="10"/>
        <circle cx="550" cy="360" r="73" fill="none" stroke="#aaa" stroke-width="3"/>
        <g class="spokes" stroke="#bbb" stroke-width="1.6"></g>
        <circle cx="550" cy="360" r="8" fill="#666"/>
      </g>

      <!-- 车架 -->
      <g stroke="#d9432f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M250 360 L390 360 L345 245 Z"/>
        <path d="M345 245 L515 238 L390 360"/>
        <path d="M515 238 L550 360"/>
        <path d="M512 225 L520 250"/>
      </g>
      <!-- 链条 -->
      <path d="M250 352 L390 342 M250 368 L390 378" stroke="#444" stroke-width="2.5"/>
      <circle cx="390" cy="360" r="18" fill="none" stroke="#444" stroke-width="4"/>
      <!-- 车把 -->
      <path d="M512 225 Q505 200 520 196 L545 198" fill="none" stroke="#333" stroke-width="7" stroke-linecap="round"/>
      <rect x="535" y="192" width="18" height="10" rx="4" fill="#222"/>
      <!-- 车座 -->
      <line x1="345" y1="245" x2="340" y2="232" stroke="#333" stroke-width="6"/>
      <path d="M312 228 Q340 220 368 230 Q345 238 312 234 Z" fill="#222"/>

      <!-- 鹈鹕本体 -->
      <g id="pelican">
        <!-- 尾巴 -->
        <path d="M285 185 L238 170 L248 190 L232 200 L285 205 Z" fill="#cfc8b8" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
        <!-- 身体 -->
        <ellipse cx="345" cy="188" rx="82" ry="50" transform="rotate(-12 345 188)" fill="url(#bodyG)" stroke="#555" stroke-width="2.5"/>
        <!-- 脖子 -->
        <path d="M400 165 C430 150 420 120 445 100" fill="none" stroke="#555" stroke-width="32" stroke-linecap="round"/>
        <path d="M400 165 C430 150 420 120 445 100" fill="none" stroke="#fbf8f1" stroke-width="27" stroke-linecap="round"/>
        <!-- 翅膀（伸向车把） -->
        <path d="M300 165 C340 140 400 150 450 175 C490 190 520 195 540 197
                 C515 205 490 208 460 206 L470 214 C440 216 420 214 400 210 L408 220
                 C370 222 330 212 300 195 Z"
              fill="#c9c2b2" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M330 172 C370 165 410 175 445 190 M335 190 C370 190 405 196 430 202"
              fill="none" stroke="#9e9788" stroke-width="2"/>
        <path d="M460 206 C480 205 500 203 520 200 C505 198 480 196 455 192 Z" fill="#3a3a3a"/>
        <!-- 头 -->
        <circle cx="455" cy="92" r="26" fill="#fbf8f1" stroke="#555" stroke-width="2.5"/>
        <path d="M438 72 Q445 55 460 62 Q452 66 450 72" fill="#f4d35e" stroke="#555" stroke-width="1.5"/>
        <!-- 喙囊 -->
        <path d="M468 104 C500 150 560 158 640 122 C590 122 530 112 470 100 Z"
              fill="#f08a3c" stroke="#8a4a1a" stroke-width="2" stroke-linejoin="round"/>
        <!-- 上喙 -->
        <path d="M468 84 C520 92 590 105 640 116 Q652 120 644 128 Q636 126 632 121 C580 116 520 108 470 102 Z"
              fill="url(#beakG)" stroke="#8a4a1a" stroke-width="2" stroke-linejoin="round"/>
        <line x1="478" y1="95" x2="628" y2="118" stroke="#b86a1e" stroke-width="1.5"/>
        <!-- 眼睛 -->
        <circle cx="462" cy="86" r="6" fill="#fff" stroke="#555" stroke-width="1"/>
        <circle id="eye" cx="464" cy="86" r="3.5" fill="#1a1a1a"/>
        <circle cx="465.5" cy="84.5" r="1.2" fill="#fff"/>
      </g>

      <!-- 近侧曲柄、腿 -->
      <line id="crankNear" stroke="#777" stroke-width="7" stroke-linecap="round"/>
      <rect id="pedalNear" width="24" height="7" rx="2" fill="#333"/>
      <path id="legNear" fill="none" stroke="#f0913a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon id="footNear" fill="#f0913a" stroke="#b8621e" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="390" cy="360" r="6" fill="#999"/>
    </g>
  </svg>
  <div class="ctrl">
    速度 <input id="speed" type="range" min="0" max="3" step="0.1" value="1">
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';

  document.querySelectorAll('.spokes').forEach(g => {
    const cx = g.parentNode.id === 'wheelRear' ? 250 : 550, cy = 360;
    for (let i = 0; i < 16; i++) {
      const a = i * Math.PI / 8;
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', cx); l.setAttribute('y1', cy);
      l.setAttribute('x2', cx + Math.cos(a) * 72); l.setAttribute('y2', cy + Math.sin(a) * 72);
      g.appendChild(l);
    }
  });

  const BB = { x: 390, y: 360 }, CRANK = 34, THIGH = 84, SHIN = 84;

  function knee(hip, foot) {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    const d = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.5);
    const base = Math.atan2(dy, dx);
    const a = Math.acos((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d));
    return { x: hip.x + THIGH * Math.cos(base - a), y: hip.y + THIGH * Math.sin(base - a) };
  }

  function drawLeg(side, hip, angle) {
    const p = { x: BB.x + Math.cos(angle) * CRANK, y: BB.y + Math.sin(angle) * CRANK };
    const k = knee(hip, p);
    $('leg' + side).setAttribute('d', `M${hip.x} ${hip.y} L${k.x} ${k.y} L${p.x} ${p.y}`);
    $('foot' + side).setAttribute('points',
      `${p.x - 6},${p.y - 2} ${p.x + 22},${p.y - 9} ${p.x + 16},${p.y - 1} ${p.x + 24},${p.y + 3} ${p.x - 4},${p.y + 4}`);
    const crank = $('crank' + side);
    crank.setAttribute('x1', BB.x); crank.setAttribute('y1', BB.y);
    crank.setAttribute('x2', p.x); crank.setAttribute('y2', p.y);
    const pedal = $('pedal' + side);
    pedal.setAttribute('x', p.x - 11); pedal.setAttribute('y', p.y + 2);
  }

  const clouds = [...document.querySelectorAll('.cloud')].map(el => ({ el, x: 0, s: +el.dataset.speed }));
  let theta = 0, dash = 0, last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 16.67, 3); last = now;
    const speed = +$('speed').value;
    theta += 0.06 * speed * dt;
    dash += 3.2 * speed * dt;

    const wheelDeg = theta * 2 * 180 / Math.PI;
    $('wheelRear').setAttribute('transform', `rotate(${wheelDeg} 250 360)`);
    $('wheelFront').setAttribute('transform', `rotate(${wheelDeg} 550 360)`);

    const bob = Math.sin(theta * 2) * 2.5 * Math.min(speed, 1);
    $('pelican').setAttribute('transform', `translate(0 ${bob}) rotate(${Math.sin(theta) * 1.2} 350 200)`);
    const hip = { x: 362, y: 228 + bob };
    drawLeg('Far', { x: hip.x - 6, y: hip.y - 4 }, theta + Math.PI);
    drawLeg('Near', hip, theta);

    $('roadDash').setAttribute('stroke-dashoffset', dash);
    clouds.forEach(c => {
      c.x -= c.s * speed * dt;
      if (c.x < -900) c.x += 1000;
      c.el.setAttribute('transform', `translate(${c.x} 0)`);
    });

    $('eye').setAttribute('cx', 464 + Math.sin(now / 900) * 1.2);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
