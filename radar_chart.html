<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 模型智能体能力雷达图</title>
<script src="./RuoYi-Vue3-master/node_modules/echarts/dist/echarts.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #main { width: 1600px; height: 1000px; }
</style>
</head>
<body>
<div id="main"></div>
<script>
// 12 项基准：中文名 + 英文原名 + 各模型总分（数据来自 Qwen Leaderboard v1.2）
const benchmarks = [
  { cn: '终端操作',       en: 'Terminal Bench 2.1' },
  { cn: '软件工程解题',   en: 'DeepSWE' },
  { cn: '编程竞赛题',     en: 'ProgramBench' },
  { cn: '大代码库重构',   en: 'SWE Atlas' },
  { cn: '命令行智能体',   en: 'ALE-CLI' },
  { cn: '工具链任务',     en: 'Toolathon' },
  { cn: '长程多步任务',   en: 'APEX-Agents' },
  { cn: '后训练评估',     en: 'PostTrainBench' },
  { cn: '百万级综合任务', en: 'OneMillionBench' },
  { cn: '生物医学难题',   en: 'BioMysteryBench' },
  { cn: '人类终极考试',   en: 'HLE' },
  { cn: '数学难题',       en: 'HorizonMath' }
];

// 各模型在 12 项上的总分
const models = [
  { name: 'Claude Opus 5', color: '#ee6666', data: [88.3, 74.7, 25.0, 60.0, 27.6, 76.5, 41.8, 36.2, 68.1, 73.1, 53.2, 10.6] },
  { name: 'GLM 5.0 (Z)',   color: '#3ba272', data: [85.8, 68.9, 24.5, 51.9, 25.1, 73.8, 37.9, 35.0, 64.5, 69.0, 46.6, 7.1] },
  { name: 'Hy4 preview',   color: '#5470c6', data: [85.4, 64.3, 17.5, 53.3, 22.8, 74.1, 37.1, 35.6, 65.4, 71.3, 43.4, 8.8] },
  { name: 'Z',             color: '#9a60b4', data: [85.7, 68.1, 18.0, 51.0, 23.8, 73.2, 37.2, 33.2, 63.5, 61.6, 42.3, 5.3] },
  { name: "K' (Kimi)",     color: '#fc8452', data: [85.4, 58.8, 17.5, 37.4, 23.2, 70.1, 34.0, 32.0, 63.1, 61.3, 41.5, 5.3] },
  { name: 'Qwen3.8 Max',   color: '#999999', data: [80.3, 55.6, 15.5, 48.6, 21.9, 69.1, 32.4, 24.5, 62.0, 58.9, 40.5, 4.4] }
];

// 每个轴的最大值 = 该项第一名得分 * 1.08（留一点边距，越靠外越强）
const indicators = benchmarks.map((b, i) => {
  const top = Math.max(...models.map(m => m.data[i]));
  return { name: b.cn + '\n' + b.en, max: Math.round(top * 1.08 * 10) / 10 };
});

const chart = echarts.init(document.getElementById('main'), null, { devicePixelRatio: 2 });
chart.setOption({
  title: {
    text: 'AI 模型智能体能力雷达图（12 项基准）',
    subtext: '数据来源：Qwen Leaderboard v1.2（2026-08-11）· 每条轴刻度不同，越靠外表示相对该项第一名越强',
    left: 'center', top: 10,
    textStyle: { fontSize: 26 }, subtextStyle: { fontSize: 14 }
  },
  tooltip: {
    trigger: 'item',
    formatter: function (params) {
      let html = '<b>' + params.name + '</b><br/>';
      params.value.forEach((v, i) => {
        html += benchmarks[i].cn + '（' + benchmarks[i].en + '）：' + v + '<br/>';
      });
      return html;
    }
  },
  legend: {
    bottom: 10, icon: 'roundRect', itemWidth: 20, itemHeight: 12,
    textStyle: { fontSize: 15 }, data: models.map(m => m.name)
  },
  radar: {
    center: ['50%', '54%'], radius: '62%',
    indicator: indicators,
    splitNumber: 4,
    axisName: {
      color: '#333', fontSize: 14, fontWeight: 'bold',
      formatter: function (name) {
        const parts = name.split('\n');
        return '{cn|' + parts[0] + '}\n{en|' + parts[1] + '}';
      },
      rich: {
        cn: { fontSize: 16, fontWeight: 'bold', color: '#222', lineHeight: 22 },
        en: { fontSize: 11, color: '#888', lineHeight: 16 }
      }
    }
  },
  series: [{
    type: 'radar',
    symbol: 'circle', symbolSize: 5,
    data: models.map(m => ({
      name: m.name,
      value: m.data,
      lineStyle: { width: 2.5, color: m.color },
      itemStyle: { color: m.color },
      areaStyle: { color: m.color, opacity: 0.06 },
      label: { show: false }
    }))
  }]
});
window.__ready = true;
</script>
</body>
</html>
