<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹧鸪骑车</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    background: linear-gradient(160deg, #fdf6e3, #e7f0ff);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #333;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: 4px; }
  .stage {
    width: min(960px, 100%);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
    background: #bfe6ff;
  }
  svg { display: block; width: 100%; height: auto; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
  button {
    font: inherit;
    padding: 8px 18px;
    border: none;
    border-radius: 999px;
    background: #2f6fde;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 3px 0 #1d4fa8;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #1d4fa8; }
  button:focus-visible, input:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
  label { display: flex; align-items: center; gap: 8px; }
  output { min-width: 3em; font-variant-numeric: tabular-nums; }
  .hint { font-size: 14px; color: #666; margin: 0; }
  .bird { cursor: pointer; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<h1>鹧鸪骑车</h1>

<div class="stage">
<svg id="scene" viewBox="0 0 800 450" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">鹧鸪骑自行车</title>
  <desc id="svgDesc">一只戴着橙色头盔、围着红围巾的鹧鸪在乡间公路上骑自行车，背景有山丘、树木和云朵。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="1" stop-color="#fdf1d6"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset=".6" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#ffb703"/>
    </radialGradient>
    <!-- 鹧鸪身上的白色斑点 -->
    <pattern id="spots" width="12" height="10" patternUnits="userSpaceOnUse">
      <ellipse cx="3" cy="3" rx="2" ry="1.6" fill="#fff" opacity=".85"/>
      <ellipse cx="9" cy="8" rx="2" ry="1.6" fill="#fff" opacity=".85"/>
    </pattern>
    <pattern id="wingBars" width="10" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <rect width="10" height="2.2" fill="#e9d3a8" opacity=".75"/>
    </pattern>
  </defs>

  <!-- 天空与太阳 -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <g id="sunRays" stroke="#ffd84d" stroke-width="4" stroke-linecap="round" opacity=".7"></g>
  <circle cx="680" cy="80" r="36" fill="url(#sunGlow)"/>
  <g id="clouds" fill="#fff" opacity=".92"></g>

  <!-- 远近山丘 -->
  <path id="hillsFar" fill="#b7dcb0"/>
  <path id="hillsNear" fill="#92c983"/>
  <g id="trees"></g>

  <!-- 公路 -->
  <rect x="0" y="343" width="800" height="4" fill="#d8cfb8"/>
  <rect x="0" y="347" width="800" height="48" fill="#6f747c"/>
  <line id="dashes" x1="0" y1="380" x2="800" y2="380" stroke="#fff" stroke-width="4" stroke-dasharray="34 26"/>
  <rect x="0" y="393" width="800" height="3" fill="#d8cfb8"/>
  <rect x="0" y="396" width="800" height="54" fill="#7dbb5a"/>
  <g id="dust" fill="#c8bfae"></g>
  <ellipse cx="385" cy="361" rx="125" ry="5" fill="#000" opacity=".18"/>

  <!-- 远侧腿（在车架后面） -->
  <g id="legFar">
    <line id="crankF" stroke="#444" stroke-width="4" stroke-linecap="round"/>
    <rect id="pedalF" width="14" height="4" rx="1" fill="#333"/>
    <line id="thighF" class="bird" stroke="#1f1814" stroke-width="14" stroke-linecap="round"/>
    <line id="shinF" class="bird" stroke="#b86a1c" stroke-width="4.5" stroke-linecap="round"/>
    <path id="toesF" class="bird" stroke="#b86a1c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 车轮 -->
  <g>
    <circle cx="300" cy="310" r="50" fill="none" stroke="#1f1f1f" stroke-width="7"/>
    <circle cx="300" cy="310" r="45" fill="none" stroke="#c9ccd1" stroke-width="2.5"/>
    <g id="spokesR"></g>
    <circle cx="300" cy="310" r="5" fill="#555"/>
  </g>
  <g>
    <circle cx="470" cy="310" r="50" fill="none" stroke="#1f1f1f" stroke-width="7"/>
    <circle cx="470" cy="310" r="45" fill="none" stroke="#c9ccd1" stroke-width="2.5"/>
    <g id="spokesF"></g>
    <circle cx="470" cy="310" r="5" fill="#555"/>
  </g>

  <!-- 链条与牙盘 -->
  <line id="chainTop" x1="300" y1="304" x2="380" y2="302" stroke="#444" stroke-width="1.8" stroke-dasharray="3 2"/>
  <line id="chainBot" x1="300" y1="316" x2="380" y2="328" stroke="#444" stroke-width="1.8" stroke-dasharray="3 2"/>
  <circle cx="300" cy="310" r="6" fill="none" stroke="#666" stroke-width="2.5"/>
  <g id="chainring">
    <circle cx="380" cy="315" r="13" fill="none" stroke="#666" stroke-width="3"/>
  </g>

  <!-- 车架 -->
  <g stroke="#d62828" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="300" y1="310" x2="380" y2="315"/>
    <line x1="300" y1="310" x2="356" y2="242"/>
    <line x1="380" y1="315" x2="354" y2="238"/>
    <line x1="356" y1="244" x2="449" y2="240"/>
    <line x1="380" y1="315" x2="456" y2="262"/>
    <line x1="449" y1="236" x2="457" y2="264" stroke-width="8"/>
    <line x1="457" y1="262" x2="470" y2="310" stroke-width="5"/>
  </g>
  <line x1="354" y1="238" x2="351" y2="233" stroke="#555" stroke-width="4"/>
  <path d="M334 234 Q350 227 367 233 L362 238 L339 238 Z" fill="#222"/>
  <line x1="449" y1="236" x2="447" y2="216" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <path d="M447 216 Q438 210 424 212" stroke="#555" stroke-width="4" fill="none" stroke-linecap="round"/>
  <line x1="423" y1="212" x2="431" y2="211" stroke="#222" stroke-width="6" stroke-linecap="round"/>
  <rect x="452" y="226" width="9" height="7" rx="2" fill="#ffe066" stroke="#555" stroke-width="1"/>
  <g id="bell"><circle cx="440" cy="210" r="4" fill="#ffd23f" stroke="#a67c00" stroke-width="1"/></g>

  <!-- 鹧鸪上半身（后层）：尾巴与身体 -->
  <g id="upperBack" class="bird">
    <path d="M334 198 C314 182 298 172 290 166 C295 184 305 202 331 213 Z" fill="#3a2c25"/>
    <path d="M300 176 L318 196 M296 186 L316 204" stroke="#7b6452" stroke-width="2" fill="none"/>
    <ellipse cx="378" cy="196" rx="52" ry="40" transform="rotate(-15 378 196)" fill="#2e2622"/>
    <ellipse cx="378" cy="196" rx="52" ry="40" transform="rotate(-15 378 196)" fill="url(#spots)"/>
  </g>

  <!-- 近侧腿 -->
  <g id="legNear">
    <line id="crankN" stroke="#555" stroke-width="4" stroke-linecap="round"/>
    <rect id="pedalN" width="14" height="4" rx="1" fill="#222"/>
    <line id="thighN" class="bird" stroke="#2e2622" stroke-width="15" stroke-linecap="round"/>
    <line id="shinN" class="bird" stroke="#f08c2e" stroke-width="4.5" stroke-linecap="round"/>
    <path id="toesN" class="bird" stroke="#f08c2e" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 鹧鸪上半身（前层）：围巾、头、翅膀 -->
  <g id="upperFront" class="bird">
    <path id="scarf1" stroke="#e63946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path id="scarf2" stroke="#c1121f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g id="head">
      <path d="M402 184 Q411 162 428 150" stroke="#2e2622" stroke-width="22" stroke-linecap="round" fill="none"/>
      <circle cx="432" cy="140" r="21" fill="#3a2c25"/>
      <ellipse cx="440" cy="157" rx="11" ry="7" fill="#9c4a24"/>
      <path d="M452 146 Q436 152 414 144" stroke="#fff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M449 127 Q437 123 423 128" stroke="#f3e9d2" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <g id="eye">
        <circle cx="441" cy="134" r="4" fill="#111"/>
        <circle cx="442.5" cy="132.5" r="1.3" fill="#fff"/>
      </g>
      <path d="M451 135 Q462 137 466 142 Q459 146 451 146 Z" fill="#2b2b2b"/>
      <!-- 头盔 -->
      <path d="M409 133 C410 110 452 106 456 128 L409 133 Z" fill="#ff6b35" stroke="#c44d1c" stroke-width="1.5"/>
      <path d="M420 115 Q432 110 446 114" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
      <path d="M452 128 L462 126" stroke="#c44d1c" stroke-width="3" stroke-linecap="round"/>
      <line x1="414" y1="134" x2="430" y2="159" stroke="#333" stroke-width="1.5"/>
    </g>
    <ellipse cx="409" cy="170" rx="13" ry="6" transform="rotate(-55 409 170)" fill="#e63946"/>
    <!-- 翅膀扶着车把 -->
    <path d="M352 188 C370 165 405 170 420 195 L431 209 C419 215 405 214 395 212 C378 214 360 210 352 188 Z" fill="#6b4f3a"/>
    <path d="M352 188 C370 165 405 170 420 195 L431 209 C419 215 405 214 395 212 C378 214 360 210 352 188 Z" fill="url(#wingBars)"/>
    <ellipse cx="428" cy="210" rx="6" ry="5" fill="#5a4230"/>
  </g>

  <g id="tufts"></g>

  <!-- 对话气泡 -->
  <g id="bubble" opacity="0" pointer-events="none">
    <path d="M470 108 L462 126 L488 108 Z" fill="#fff" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
    <rect x="450" y="58" width="210" height="50" rx="16" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="466" y="104" width="24" height="6" fill="#fff"/>
    <text id="bubbleText" x="555" y="90" text-anchor="middle" font-size="20" font-weight="bold" fill="#333"
          font-family="PingFang SC, Microsoft YaHei, sans-serif">行不得也哥哥~</text>
  </g>
</svg>
</div>

<div class="controls">
  <button id="toggleBtn" type="button" aria-pressed="false">暂停</button>
  <button id="bellBtn" type="button">按车铃</button>
  <label for="speed">速度
    <input id="speed" type="range" min="0" max="400" step="10" value="180">
    <output id="speedVal" for="speed">180</output>
  </label>
</div>
<p class="hint">点一下鹧鸪听它说话，按空格键暂停/继续</p>
<p id="live" class="sr-only" aria-live="polite"></p>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  // 几何常量
  const R = 50;                         // 车轮半径
  const BB = { x: 380, y: 315 };        // 牙盘中心
  const CRANK = 22;                     // 曲柄长度
  const HIP = { x: 362, y: 228 };       // 髋关节
  const THIGH = 52, SHIN = 62;          // 大腿、小腿长度

  // 车轮辐条
  function buildSpokes(group, cx, cy) {
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      el('line', {
        x1: cx, y1: cy,
        x2: (cx + Math.cos(a) * 44).toFixed(1), y2: (cy + Math.sin(a) * 44).toFixed(1),
        stroke: '#a9adb3', 'stroke-width': 1
      }, group);
    }
    el('rect', { x: cx + 26, y: cy - 3, width: 9, height: 6, rx: 1.5, fill: '#ff9f1c' }, group);
  }
  buildSpokes($('spokesR'), 300, 310);
  buildSpokes($('spokesF'), 470, 310);

  // 牙盘辐条
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    el('line', {
      x1: BB.x, y1: BB.y,
      x2: (BB.x + Math.cos(a) * 12).toFixed(1), y2: (BB.y + Math.sin(a) * 12).toFixed(1),
      stroke: '#777', 'stroke-width': 2
    }, $('chainring'));
  }

  // 太阳光芒
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    el('line', {
      x1: (680 + Math.cos(a) * 46).toFixed(1), y1: (80 + Math.sin(a) * 46).toFixed(1),
      x2: (680 + Math.cos(a) * 60).toFixed(1), y2: (80 + Math.sin(a) * 60).toFixed(1)
    }, $('sunRays'));
  }

  // 山丘：周期 800，宽 1600，平移可无缝循环
  function hillPath(baseY, amp, phase) {
    let d = 'M0 450';
    for (let x = 0; x <= 1600; x += 20) {
      const y = baseY
        - amp * (0.55 + 0.45 * Math.sin(2 * Math.PI * x / 800 + phase))
        - amp * 0.25 * Math.sin(2 * Math.PI * x / 400 + phase * 2);
      d += ` L${x} ${y.toFixed(1)}`;
    }
    return d + ' L1600 450 Z';
  }
  $('hillsFar').setAttribute('d', hillPath(300, 90, 0.6));
  $('hillsNear').setAttribute('d', hillPath(335, 50, 2.1));

  // 云
  const clouds = [
    { x: 120, y: 70, s: 1.1, v: 1 },
    { x: 420, y: 45, s: 0.8, v: 0.7 },
    { x: 700, y: 130, s: 0.95, v: 0.85 }
  ].map(c => {
    const g = el('g', {}, $('clouds'));
    el('ellipse', { cx: 0, cy: 0, rx: 42, ry: 16 }, g);
    el('circle', { cx: -16, cy: -10, r: 17 }, g);
    el('circle', { cx: 12, cy: -15, r: 22 }, g);
    c.g = g;
    return c;
  });

  // 树（视差 0.6）
  const TREE_SPAN = 1700;
  const trees = [0, 230, 420, 690, 900, 1150, 1400].map((x0, i) => {
    const g = el('g', {}, $('trees'));
    const s = 0.8 + (i % 3) * 0.2;
    const inner = el('g', { transform: `scale(${s})` }, g);
    if (i % 2 === 0) {
      el('rect', { x: -4, y: -32, width: 8, height: 32, fill: '#7a5230' }, inner);
      el('circle', { cx: 0, cy: -48, r: 22, fill: '#4f9a45' }, inner);
      el('circle', { cx: -13, cy: -38, r: 14, fill: '#5aa84f' }, inner);
      el('circle', { cx: 13, cy: -39, r: 15, fill: '#468c3d' }, inner);
    } else {
      el('rect', { x: -3, y: -20, width: 6, height: 20, fill: '#6b4526' }, inner);
      el('path', { d: 'M-22 -18 L0 -70 L22 -18 Z', fill: '#3f7f3a' }, inner);
      el('path', { d: 'M-17 -40 L0 -85 L17 -40 Z', fill: '#4a8f43' }, inner);
    }
    return { x0, g };
  });

  // 前景草丛与小花（视差 1.4）
  const TUFT_SPAN = 1000;
  const flowerColors = ['#ff6b6b', '#ffd23f', '#ffffff', '#c77dff'];
  const tufts = [40, 190, 330, 520, 640, 810, 930].map((x0, i) => {
    const g = el('g', {}, $('tufts'));
    const y = 418 + (i % 3) * 9;
    el('path', {
      d: `M-10 ${y} Q-8 ${y - 16} -12 ${y - 22} M-3 ${y} Q-2 ${y - 20} 2 ${y - 28} M4 ${y} Q7 ${y - 14} 12 ${y - 18}`,
      stroke: '#4f8f3a', 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round'
    }, g);
    if (i % 2 === 0) {
      el('circle', { cx: 2, cy: y - 30, r: 5, fill: flowerColors[i % flowerColors.length] }, g);
      el('circle', { cx: 2, cy: y - 30, r: 2, fill: '#f4a300' }, g);
    }
    return { x0, g };
  });

  // 两段骨骼 IK：已知髋和脚，求膝盖（选择朝前弯曲的解）
  function solveKnee(h, p) {
    const dx = p.x - h.x, dy = p.y - h.y;
    const d = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.01);
    const th = Math.atan2(dy, dx);
    const cosA = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
    const al = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const k1 = { x: h.x + THIGH * Math.cos(th - al), y: h.y + THIGH * Math.sin(th - al) };
    const k2 = { x: h.x + THIGH * Math.cos(th + al), y: h.y + THIGH * Math.sin(th + al) };
    return k1.x > k2.x ? k1 : k2;
  }

  function setLine(id, a, b) {
    const e = $(id);
    e.setAttribute('x1', a.x.toFixed(1)); e.setAttribute('y1', a.y.toFixed(1));
    e.setAttribute('x2', b.x.toFixed(1)); e.setAttribute('y2', b.y.toFixed(1));
  }

  function setLeg(side, hip, pedal) {
    setLine('crank' + side, BB, pedal);
    const pd = $('pedal' + side);
    pd.setAttribute('x', (pedal.x - 7).toFixed(1));
    pd.setAttribute('y', (pedal.y - 2).toFixed(1));
    const foot = { x: pedal.x, y: pedal.y - 3 };
    const knee = solveKnee(hip, foot);
    setLine('thigh' + side, hip, knee);
    setLine('shin' + side, knee, foot);
    const fx = foot.x, fy = foot.y;
    $('toes' + side).setAttribute('d',
      `M${fx - 5} ${fy} L${fx + 9} ${fy - 1} M${fx} ${fy} L${fx + 8} ${fy + 3} M${fx} ${fy} L${fx + 7} ${fy - 4}`);
  }

  function scarfPath(len, phase, yOff, t, speed) {
    const pts = [];
    const lift = speed / 400;
    for (let i = 0; i <= len; i++) {
      pts.push({
        x: 404 - i * 13,
        y: 168 + yOff - i * lift * 2 + i * (1 - lift) * 2 + Math.sin(t * (6 + lift * 10) - i * 0.9 + phase) * i * 1.3
      });
    }
    return 'M' + pts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L');
  }

  // 状态
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let speed = reduceMotion ? 60 : 180;
  let paused = false;
  let dist = 0, t = 0, last = performance.now();
  let blinkTimer = 2, blinkLeft = 0;
  let bubbleLeft = 0, bellLeft = 0;
  const dust = [];
  let dustAcc = 0;

  const speedInput = $('speed');
  speedInput.value = speed;
  $('speedVal').textContent = speed;
  speedInput.addEventListener('input', () => {
    speed = Number(speedInput.value);
    $('speedVal').textContent = speed;
  });

  const toggleBtn = $('toggleBtn');
  function togglePause() {
    paused = !paused;
    toggleBtn.textContent = paused ? '继续' : '暂停';
    toggleBtn.setAttribute('aria-pressed', String(paused));
  }
  toggleBtn.addEventListener('click', togglePause);

  function say(text, seconds = 1.8) {
    $('bubbleText').textContent = text;
    $('live').textContent = text;
    bubbleLeft = seconds;
  }

  $('bellBtn').addEventListener('click', () => {
    bellLeft = 0.6;
    say('叮铃铃~ 让一让');
  });

  const lines = ['行不得也哥哥~', '钩辀格磔！', '我骑得快不快？', '前面有虫子吃吗？', '头盔要戴好！'];
  let lineIdx = 0;
  $('scene').addEventListener('click', e => {
    if (e.target.closest('.bird')) {
      say(lines[lineIdx]);
      lineIdx = (lineIdx + 1) % lines.length;
    }
  });

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !['BUTTON', 'INPUT'].includes(e.target.tagName)) {
      e.preventDefault();
      togglePause();
    }
  });

  const mod = (a, n) => ((a % n) + n) % n;

  function update(dt, realDt) {
    dist += speed * dt;
    t += dt;

    // 车轮与牙盘
    const wheelRad = dist / R;
    const wheelDeg = wheelRad * 180 / Math.PI;
    $('spokesR').setAttribute('transform', `rotate(${wheelDeg.toFixed(2)} 300 310)`);
    $('spokesF').setAttribute('transform', `rotate(${wheelDeg.toFixed(2)} 470 310)`);
    const a = wheelRad * 0.9;
    $('chainring').setAttribute('transform', `rotate(${(a * 180 / Math.PI).toFixed(2)} ${BB.x} ${BB.y})`);
    $('chainTop').setAttribute('stroke-dashoffset', (-(dist * 0.4) % 5).toFixed(2));
    $('chainBot').setAttribute('stroke-dashoffset', ((dist * 0.4) % 5).toFixed(2));

    // 身体随踩踏上下起伏、点头
    const bob = 1.8 * Math.sin(2 * a);
    const bobT = `translate(0 ${bob.toFixed(2)})`;
    $('upperBack').setAttribute('transform', bobT);
    $('upperFront').setAttribute('transform', bobT);
    $('head').setAttribute('transform', `rotate(${(2.5 * Math.sin(2 * a + 0.8)).toFixed(2)} 410 176)`);

    // 双腿
    const hip = { x: HIP.x, y: HIP.y + bob };
    const pN = { x: BB.x + CRANK * Math.cos(a), y: BB.y + CRANK * Math.sin(a) };
    const pF = { x: BB.x - CRANK * Math.cos(a), y: BB.y - CRANK * Math.sin(a) };
    setLeg('N', hip, pN);
    setLeg('F', { x: hip.x - 4, y: hip.y }, pF);

    // 围巾
    $('scarf1').setAttribute('d', scarfPath(5, 0, 0, t, speed));
    $('scarf2').setAttribute('d', scarfPath(4, 1.3, 5, t, speed));

    // 眨眼
    blinkTimer -= dt;
    if (blinkTimer <= 0) { blinkLeft = 0.15; blinkTimer = 2 + Math.random() * 3; }
    let sy = 1;
    if (blinkLeft > 0) { blinkLeft -= dt; sy = 0.12; }
    $('eye').setAttribute('transform', `translate(441 134) scale(1 ${sy}) translate(-441 -134)`);

    // 视差背景
    $('dashes').setAttribute('stroke-dashoffset', (dist % 60).toFixed(1));
    $('hillsFar').setAttribute('transform', `translate(${(-mod(dist * 0.15, 800)).toFixed(1)} 0)`);
    $('hillsNear').setAttribute('transform', `translate(${(-mod(dist * 0.35, 800)).toFixed(1)} 0)`);
    trees.forEach(tr => {
      const x = mod(tr.x0 - dist * 0.6, TREE_SPAN) - 100;
      tr.g.setAttribute('transform', `translate(${x.toFixed(1)} 347)`);
    });
    tufts.forEach(tf => {
      const x = mod(tf.x0 - dist * 1.4, TUFT_SPAN) - 100;
      tf.g.setAttribute('transform', `translate(${x.toFixed(1)} 0)`);
    });
    clouds.forEach(c => {
      c.x -= (6 + speed * 0.03) * c.v * dt;
      if (c.x < -90) c.x = 890;
      c.g.setAttribute('transform', `translate(${c.x.toFixed(1)} ${c.y}) scale(${c.s})`);
    });
    $('sunRays').setAttribute('transform', `rotate(${(t * 8).toFixed(2)} 680 80)`);

    // 后轮扬尘
    dustAcc += speed * dt / 40;
    while (dustAcc >= 1) {
      dustAcc -= 1;
      const c = el('circle', { r: 3 }, $('dust'));
      dust.push({ c, x: 296 + Math.random() * 8, y: 357, vy: -10 - Math.random() * 15, life: 0.8, r: 2 + Math.random() * 2 });
    }
    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.life -= dt;
      if (p.life <= 0) { p.c.remove(); dust.splice(i, 1); continue; }
      p.x -= speed * dt;
      p.y += p.vy * dt;
      p.r += 6 * dt;
      p.c.setAttribute('cx', p.x.toFixed(1));
      p.c.setAttribute('cy', p.y.toFixed(1));
      p.c.setAttribute('r', p.r.toFixed(1));
      p.c.setAttribute('opacity', (p.life / 0.8 * 0.6).toFixed(2));
    }

    // 车铃晃动、气泡（暂停时也生效）
    if (bellLeft > 0) {
      bellLeft -= realDt;
      const ang = Math.sin(bellLeft * 60) * 18 * Math.max(bellLeft, 0) / 0.6;
      $('bell').setAttribute('transform', `rotate(${ang.toFixed(2)} 440 214)`);
    } else {
      $('bell').removeAttribute('transform');
    }
    if (bubbleLeft > 0) {
      bubbleLeft -= realDt;
      $('bubble').setAttribute('opacity', Math.min(1, bubbleLeft * 4).toFixed(2));
    } else {
      $('bubble').setAttribute('opacity', 0);
    }
  }

  function frame(now) {
    const realDt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(paused ? 0 : realDt, realDt);
    requestAnimationFrame(frame);
  }
  update(0, 0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
