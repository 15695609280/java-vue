<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹧鸪骑行记 · 山水行</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* 场景里的摆动动画 */
  .sway  { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: skewX(-6deg); } to { transform: skewX(6deg); } }
  .tsway { transform-box: fill-box; transform-origin: 50% 100%; animation: tsway 5s ease-in-out infinite alternate; }
  @keyframes tsway { from { transform: rotate(-1.3deg); } to { transform: rotate(1.5deg); } }
  .wsway { transform-box: fill-box; transform-origin: 50% 0%; animation: wsway 4.2s ease-in-out infinite alternate; }
  @keyframes wsway { from { transform: skewX(-8deg); } to { transform: skewX(7deg); } }
  .tw { animation: tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: .2; } to { opacity: 1; } }
  .smoke { transform-box: fill-box; transform-origin: center; animation: smoke 6s linear infinite; }
  @keyframes smoke { 0% { transform: translate(0,0) scale(.4); opacity: 0; } 15% { opacity: .55; }
                     100% { transform: translate(16px,-64px) scale(1.9); opacity: 0; } }
  .paused * { animation-play-state: paused !important; }
  #bell.ring { transform-box: fill-box; transform-origin: 50% 0%; animation: ring .1s linear 8 alternate; }
  @keyframes ring { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  #bubble { opacity: 0; transition: opacity .35s; pointer-events: none; }
  #bubble.show { opacity: 1; }
  #rider { cursor: pointer; outline: none; }

  /* 自行车 & 鹧鸪 */
  .tire { fill: none; stroke: var(--tire); stroke-width: 7; }
  .rim { fill: none; stroke: var(--rim); stroke-width: 2.5; }
  .spoke { fill: none; stroke: var(--rim); stroke-width: 1; opacity: .85; }
  .hub { fill: var(--metal); }
  .cog { fill: none; stroke: var(--mdark); stroke-width: 3; stroke-dasharray: 2 1.5; }
  .fender { fill: none; stroke: var(--fender); stroke-width: 6; stroke-linecap: round; }
  .chain { fill: none; stroke: var(--mdark); stroke-width: 2.4; stroke-dasharray: 3 2; }
  .frame { fill: none; stroke: var(--bike); stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
  .headtube { fill: none; stroke: var(--bike2); stroke-width: 9; stroke-linecap: round; }
  .ring { fill: none; stroke: var(--metal); stroke-width: 3.5; stroke-dasharray: 2.6 1.6; }
  .spider { stroke: var(--metal); stroke-width: 2.4; }
  .saddle { fill: var(--saddle); }
  .stem { fill: none; stroke: var(--metal); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  .grip { stroke: var(--saddle); stroke-width: 7.5; stroke-linecap: round; }
  .bellc { fill: var(--metal); stroke: var(--mdark); stroke-width: 1; }
  .bask { fill: var(--bask); } .bask2f { fill: var(--bask2); }
  .weave { fill: none; stroke: var(--bask2); stroke-width: 1.6; opacity: .8; }
  .lamp { fill: #fff6d0; stroke: var(--metal); stroke-width: 2; }
  .crank { stroke: var(--metal); stroke-width: 4.5; stroke-linecap: round; }
  .crank.far { stroke: var(--mdark); }
  .pedal { fill: var(--mdark); } .pedal.far { fill: var(--tire); }
  .thighN { fill: var(--body2); } .thighF { fill: var(--thighF); }
  .shinN { stroke: var(--leg); stroke-width: 6; stroke-linecap: round; }
  .shinF { stroke: var(--legF); stroke-width: 6; stroke-linecap: round; }
  .toesN { fill: none; stroke: var(--leg); stroke-width: 3; stroke-linecap: round; }
  .toesF { fill: none; stroke: var(--legF); stroke-width: 3; stroke-linecap: round; }
  .bodyf { fill: var(--body); } .body2f { fill: var(--body2); } .spotf { fill: var(--spot); }
  .wingf { fill: var(--wing); } .wing2f { fill: var(--wing2); } .wspotf { fill: var(--wspot); }
  .feather { fill: none; stroke: var(--wing2); stroke-width: 2; stroke-linecap: round; }
  .chestf { fill: var(--chest); } .cheekf { fill: var(--cheek); } .beakf { fill: var(--beak); }
  .blushf { fill: var(--blush); opacity: .7; } .eyew { fill: var(--eyeW); }
  .scarff { fill: var(--scarf); } .scarf2f { fill: var(--scarf2); }
  .chickf { fill: var(--chick); } .chick2s { fill: none; stroke: var(--chick2); stroke-width: 1.6; stroke-linecap: round; }
  .fl1 { fill: var(--fl1); } .fl2 { fill: var(--fl2); }
  .stemg { fill: none; stroke: var(--leaf); stroke-width: 2; }

  /* 界面 */
  .title { position: fixed; left: 28px; top: 22px; color: #fff; pointer-events: none;
    text-shadow: 0 2px 12px rgba(0,0,0,.45); max-width: 70vw; }
  .title h1 { margin: 0; font: 600 40px/1.15 "STKaiti", "KaiTi", "楷体", serif; letter-spacing: .12em; }
  .poem { margin: .45em 0 0; font: 22px/1.5 "STKaiti", "KaiTi", "楷体", serif; transition: opacity .6s; }
  .poem cite { display: block; font-style: normal; font-size: 15px; opacity: .85; margin-top: 2px; }
  .poem.fade { opacity: 0; }
  .tip { position: fixed; right: 22px; top: 24px; margin: 0; color: rgba(255,255,255,.9); font-size: 13px;
    text-shadow: 0 1px 6px rgba(0,0,0,.6); pointer-events: none; }
  .bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 14px;
    align-items: center; justify-content: center; flex-wrap: wrap; padding: 10px 16px; border-radius: 16px;
    background: rgba(18,22,40,.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.22); color: #fff; font-size: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: calc(100vw - 32px); box-sizing: border-box; }
  .bar button { appearance: none; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12);
    color: #fff; border-radius: 10px; padding: 7px 12px; font: inherit; cursor: pointer; min-height: 36px; }
  .bar button:hover { background: rgba(255,255,255,.25); }
  .bar button[aria-pressed="false"] { opacity: .7; }
  .bar button:focus-visible, .bar input:focus-visible { outline: 2px solid #ffd27a; outline-offset: 2px; }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl input { width: 130px; accent-color: #ffb36b; }
  .ctl output { min-width: 3.2em; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">鹧鸪骑自行车</title>
  <desc id="svgDesc">一只鹧鸪系着红围巾，骑着带车篮的自行车穿行在桂林山水般的田园间，天色在白昼、黄昏与夜晚之间流转。</desc>
  <defs>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--sky1)"/>
      <stop offset=".42" style="stop-color:var(--sky2)"/>
      <stop offset=".62" style="stop-color:var(--sky3)"/>
      <stop offset="1" style="stop-color:var(--sky3)"/>
    </linearGradient>
    <radialGradient id="gSunGlow">
      <stop offset="0" style="stop-color:var(--glow);stop-opacity:.8"/>
      <stop offset=".3" style="stop-color:var(--glow);stop-opacity:.28"/>
      <stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="gMoonGlow">
      <stop offset="0" stop-color="#e4ecff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#bcd0ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#bcd0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gM1" x1="0" y1="250" x2="0" y2="570" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--m1)"/><stop offset="1" style="stop-color:var(--m1b)"/>
    </linearGradient>
    <linearGradient id="gM2" x1="0" y1="330" x2="0" y2="570" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--m2)"/><stop offset="1" style="stop-color:var(--m2b)"/>
    </linearGradient>
    <linearGradient id="gM3" x1="0" y1="390" x2="0" y2="570" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--m3)"/><stop offset="1" style="stop-color:var(--m3b)"/>
    </linearGradient>
    <linearGradient id="gWater" x1="0" y1="558" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--water1)"/><stop offset="1" style="stop-color:var(--water2)"/>
    </linearGradient>
    <linearGradient id="gMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--fog);stop-opacity:0"/>
      <stop offset=".7" style="stop-color:var(--fog);stop-opacity:.65"/>
      <stop offset="1" style="stop-color:var(--fog);stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="gPuff">
      <stop offset="0" style="stop-color:var(--fog);stop-opacity:.6"/>
      <stop offset="1" style="stop-color:var(--fog);stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="gWin">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gFly">
      <stop offset="0" stop-color="#f4ff9a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#c8ff5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gBeam" x1="236" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gPool">
      <stop offset="0" stop-color="#fff0b8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff0b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gVig" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </radialGradient>
    <radialGradient id="gMilky">
      <stop offset="0" stop-color="#c9d4ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c9d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gShoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="cpWater"><rect x="0" y="559" width="1600" height="220"/></clipPath>
    <clipPath id="cpBody"><path d="M-18,-196 C-22,-248 40,-274 88,-250 C120,-232 122,-184 98,-162 C72,-140 10,-142 -8,-164 C-16,-174 -18,-186 -18,-196 Z"/></clipPath>
    <clipPath id="cpWing"><path d="M44,-230 C74,-240 112,-214 140,-186 C146,-180 150,-173 146,-169 C140,-167 134,-171 128,-175 C108,-185 80,-190 56,-192 C40,-194 32,-218 44,-230 Z"/></clipPath>
  </defs>

  <!-- 天空 -->
  <rect width="1600" height="900" fill="url(#gSky)"/>
  <g id="stars"></g>
  <g id="moon">
    <circle r="190" fill="url(#gMoonGlow)"/>
    <circle r="30" fill="#f6f1dc"/>
    <circle cx="-8" cy="-6" r="6" fill="#d9d2b8" opacity=".6"/>
    <circle cx="9" cy="5" r="4.5" fill="#d9d2b8" opacity=".6"/>
    <circle cx="4" cy="-13" r="3" fill="#d9d2b8" opacity=".5"/>
    <circle cx="-10" cy="11" r="3.5" fill="#d9d2b8" opacity=".5"/>
  </g>
  <g id="sun">
    <circle id="sunGlow" r="230" fill="url(#gSunGlow)"/>
    <circle r="40" style="fill:var(--sun)"/>
  </g>
  <g id="shoot" opacity="0"><rect x="-150" y="-1.2" width="150" height="2.4" rx="1.2" fill="url(#gShoot)"/></g>
  <g id="clouds"></g>
  <g id="flock"></g>

  <!-- 远山（桂林式喀斯特峰林） -->
  <g id="mtn1"></g>
  <g id="mtn2"></g>
  <g style="opacity:var(--mist)">
    <rect x="0" y="420" width="1600" height="160" fill="url(#gMist)"/>
    <g id="puffs"></g>
  </g>
  <g id="mtn3"></g>

  <!-- 江水与倒影 -->
  <rect x="0" y="558" width="1600" height="230" fill="url(#gWater)"/>
  <g clip-path="url(#cpWater)">
    <g opacity=".38"><g transform="translate(0,1120) scale(1,-1)"><g id="rm2"></g><g id="rm3"></g></g></g>
    <g id="wlines"></g>
  </g>
  <g opacity=".4"><g id="shimmer"></g></g>
  <g id="glitter"></g>

  <!-- 近处田园 -->
  <g id="hills"></g>
  <g id="grove"></g>
  <g id="road"></g>
  <g id="dust"></g>

  <!-- 骑车的鹧鸪（局部坐标：后轮着地点为原点） -->
  <g id="rider" transform="translate(640,774)" tabindex="0" role="button" aria-label="骑车的鹧鸪，点击听它说话">
    <ellipse id="shadow" cx="100" cy="3" rx="150" ry="9" fill="#000" opacity=".22"/>
    <g id="beam" style="opacity:0">
      <path d="M236,-172 L720,-50 L660,34 L236,-162 Z" fill="url(#gBeam)"/>
      <ellipse cx="560" cy="6" rx="170" ry="18" fill="url(#gPool)"/>
    </g>

    <!-- 远侧腿与曲柄 -->
    <path id="thighF" class="thighF"/>
    <line id="shinF" class="shinF"/>
    <path id="toesF" class="toesF"/>
    <line id="crankF" class="crank far"/>
    <rect id="pedalF" width="16" height="5" rx="1.5" class="pedal far"/>

    <!-- 车轮 -->
    <g transform="translate(0,-60)"><circle r="56.5" class="tire"/><circle r="52" class="rim"/><g id="spokesR"></g><circle r="5" class="hub"/></g>
    <g transform="translate(200,-60)"><circle r="56.5" class="tire"/><circle r="52" class="rim"/><g id="spokesF"></g><circle r="5" class="hub"/></g>
    <path class="fender" d="M-62,-82.6 A66,66 0 0 1 57.2,-93"/>
    <path class="fender" d="M142.8,-93 A66,66 0 0 1 262,-82.6"/>
    <rect x="-67" y="-93" width="6" height="10" rx="1.5" fill="#e0342b" transform="rotate(-22 -64 -88)"/>

    <!-- 链条与车架 -->
    <path id="chain" class="chain" d="M0,-70 L82,-68 A16,16 0 0 1 82,-36 L0,-50 A10,10 0 0 1 0,-70"/>
    <path class="frame" d="M0,-60 L82,-52 L51,-151 M0,-60 L54,-142 L170,-148 M82,-52 L178,-124 M178,-124 C186,-100 196,-82 200,-60"/>
    <path class="headtube" d="M170,-148 L178,-124"/>
    <g transform="translate(82,-52)">
      <g id="ring"><circle r="16" class="ring"/><path class="spider" d="M0,0 L0,-13 M0,0 L12.4,-4 M0,0 L7.6,10.5 M0,0 L-7.6,10.5 M0,0 L-12.4,-4"/></g>
      <circle r="4" class="hub"/>
    </g>
    <path class="saddle" d="M26,-151 Q26,-160 42,-160 L66,-158 Q71,-156 66,-152 Q48,-149 30,-148 Z"/>
    <path class="stem" d="M170,-148 L166,-162 Q173,-180 150,-178 L140,-177"/>
    <path class="grip" d="M150,-177.5 L134,-176.5"/>
    <path class="stem" d="M168,-164 L182,-178"/>
    <g id="bell"><circle cx="158" cy="-184" r="5.5" class="bellc"/><circle cx="156.5" cy="-185.8" r="1.8" fill="#fff" opacity=".8"/></g>

    <!-- 车篮：花与小鹧鸪 -->
    <path class="stemg" d="M188,-198 Q186,-208 190,-218 M228,-198 Q231,-208 229,-220 M200,-198 Q197,-205 195,-212"/>
    <g id="chick">
      <circle cx="207" cy="-202" r="12" class="chickf"/>
      <circle cx="214" cy="-213" r="9" class="chickf"/>
      <path class="chick2s" d="M207,-219 Q213,-224 220,-219"/>
      <path d="M222,-216 L229,-213 L222,-210 Z" fill="#f2a33a"/>
      <circle cx="217.5" cy="-215" r="1.9" fill="#1b1b1b"/>
    </g>
    <circle cx="190" cy="-220" r="6" class="fl1"/><circle cx="190" cy="-220" r="2.2" class="fl2"/>
    <circle cx="229" cy="-222" r="5.5" class="fl2"/><circle cx="229" cy="-222" r="2" class="fl1"/>
    <circle cx="195" cy="-213" r="4" class="fl1"/>
    <path class="bask" d="M178,-198 L236,-198 L230,-156 L184,-156 Z"/>
    <path class="weave" d="M180,-188 L234,-188 M181.5,-177 L232.5,-177 M183,-166 L231,-166 M190,-198 L192,-156 M202,-198 L203,-156 M214,-198 L214,-156 M226,-198 L224,-156"/>
    <rect x="176" y="-201" width="62" height="6" rx="3" class="bask2f"/>
    <circle id="lampGlow" cx="239" cy="-168" r="20" fill="url(#gWin)" style="opacity:0"/>
    <circle cx="239" cy="-168" r="5.5" class="lamp"/>

    <!-- 近侧曲柄与腿 -->
    <line id="crankN" class="crank"/>
    <rect id="pedalN" width="16" height="5" rx="1.5" class="pedal"/>
    <path id="thighN" class="thighN"/>
    <line id="shinN" class="shinN"/>
    <path id="toesN" class="toesN"/>

    <!-- 身体（随踩踏起伏） -->
    <g id="upper">
      <path class="wing2f" transform="translate(7,-5)" d="M44,-230 C74,-240 112,-214 140,-186 C146,-180 150,-173 146,-169 C140,-167 134,-171 128,-175 C108,-185 80,-190 56,-192 C40,-194 32,-218 44,-230 Z"/>
      <path id="scarfB" class="scarf2f"/>
      <path class="body2f" d="M-12,-194 C-36,-208 -56,-200 -62,-188 C-48,-182 -30,-178 -10,-176 Z"/>
      <path d="M-50,-197 L-45,-183 M-38,-201 L-33,-180" style="stroke:var(--spot);stroke-width:2;opacity:.55"/>
      <path class="bodyf" d="M-18,-196 C-22,-248 40,-274 88,-250 C120,-232 122,-184 98,-162 C72,-140 10,-142 -8,-164 C-16,-174 -18,-186 -18,-196 Z"/>
      <g id="spots" clip-path="url(#cpBody)"></g>
      <path id="scarfA" class="scarff"/>
      <g id="head">
        <circle cx="108" cy="-262" r="30" class="bodyf"/>
        <path class="chestf" d="M84,-274 Q102,-294 130,-280 Q106,-286 88,-268 Z"/>
        <path class="cheekf" d="M80,-256 Q100,-248 128,-252 Q125,-244 112,-242 Q94,-243 80,-250 Z"/>
        <ellipse cx="125" cy="-244" rx="8" ry="5" class="cheekf"/>
        <ellipse cx="110" cy="-251" rx="6" ry="3.5" class="blushf"/>
        <path class="beakf" d="M135,-271 Q151,-268 153,-260 Q147,-256 135,-257 Z"/>
        <g id="eye">
          <circle cx="118" cy="-268" r="8" class="eyew"/>
          <circle cx="119.5" cy="-268" r="5" fill="#1b1b1b"/>
          <circle cx="121.5" cy="-270.5" r="1.8" fill="#fff"/>
        </g>
      </g>
      <path class="scarff" d="M82,-242 Q104,-232 126,-236 L124,-227 Q102,-222 80,-232 Z"/>
      <circle cx="84" cy="-236" r="6.5" class="scarf2f"/>
      <path class="wingf" d="M44,-230 C74,-240 112,-214 140,-186 C146,-180 150,-173 146,-169 C140,-167 134,-171 128,-175 C108,-185 80,-190 56,-192 C40,-194 32,-218 44,-230 Z"/>
      <g id="wspots" clip-path="url(#cpWing)"></g>
      <path class="feather" d="M120,-190 C128,-184 136,-178 142,-172 M104,-196 C116,-190 126,-182 134,-175 M88,-200 C100,-194 112,-188 122,-180"/>
    </g>

    <!-- 对话气泡 -->
    <g id="bubble">
      <path d="M20,-372 h210 a14 14 0 0 1 14 14 v30 a14 14 0 0 1 -14 14 h-110 l-14 16 l-2 -16 h-84 a14 14 0 0 1 -14 -14 v-30 a14 14 0 0 1 14 -14 z" fill="#fffdf6" stroke="#3a2c24" stroke-width="2"/>
      <text id="bubbleText" x="125" y="-335" text-anchor="middle" dominant-baseline="middle" font-size="22" fill="#3a2c24" font-family="STKaiti, KaiTi, 楷体, serif">行不得也哥哥～</text>
    </g>
  </g>

  <g id="front"></g>
  <g id="fx"></g>
  <rect width="1600" height="900" fill="url(#gVig)" pointer-events="none"/>
</svg>

<header class="title">
  <h1>鹧鸪骑行记</h1>
  <p class="poem" id="poem"><span id="poemText"></span><cite id="poemBy"></cite></p>
</header>
<p class="tip">点击鹧鸪听它说话 · 空格 暂停 · B 按铃 · ←/→ 调速</p>

<div class="bar" role="toolbar" aria-label="动画控制">
  <button id="btnPlay" type="button" aria-label="暂停动画">❚❚ 暂停</button>
  <button id="btnBell" type="button" aria-label="按车铃">🔔 按铃</button>
  <label class="ctl"><span>速度</span><input id="speed" type="range" min="0.2" max="2.5" step="0.1" value="1"><output id="speedOut">1.0×</output></label>
  <label class="ctl"><span>时辰</span><input id="tod" type="range" min="0" max="999" step="1" value="300"><output id="todOut">正午</output></label>
  <button id="btnAuto" type="button" aria-pressed="true">⟳ 昼夜流转</button>
</div>
<noscript><p style="position:fixed;top:40%;width:100%;text-align:center;color:#fff">需要启用 JavaScript 才能观看动画。</p></noscript>

<script src="partridge-bike.js"></script>
</body>
</html>
