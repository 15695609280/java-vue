<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>把日子，骑成好风景</title>
<style>
:root{--ink:#31433b;--muted:#718078;--cream:#fffaf0;--green:#2f806d;--orange:#e97849;--line:#e9dfcf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Microsoft YaHei",sans-serif}.page{width:min(1180px,calc(100% - 36px));margin:0 auto;padding:30px 0 28px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.08em}.brand-mark{width:34px;height:34px;border-radius:13px 13px 13px 5px;background:#e89057;position:relative}.brand-mark:after{content:"";position:absolute;width:13px;height:13px;background:#fff5dd;border-radius:50%;left:10px;top:8px}.live{display:flex;align-items:center;gap:8px;color:#66756d;font-size:12px;font-weight:700;letter-spacing:.12em}.live i{width:8px;height:8px;background:#e97849;border-radius:50%;box-shadow:0 0 0 5px #f8dfcd}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:24px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.18em;margin:0 0 12px}.title{font-family:Georgia,"Microsoft YaHei",serif;font-size:clamp(34px,5vw,64px);line-height:1.07;letter-spacing:-.06em;margin:0}.subtitle{color:var(--muted);margin:15px 0 0;font-size:15px}.side-note{color:#8c9a91;font-size:12px;line-height:1.7;text-align:right;max-width:180px}.scene-wrap{border:1px solid #efe4d1;border-radius:28px;overflow:hidden;box-shadow:0 22px 55px #74532b18;background:#bee3dd}.scene{display:block;width:100%;height:auto}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:15px 17px 15px 18px;background:#fffdf8;border:1px solid var(--line);border-top:0;border-radius:0 0 24px 24px}.control-btn{border:1px solid #e7dac7;background:#fffaf1;color:var(--ink);height:40px;padding:0 15px;border-radius:13px;font-weight:800;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}.control-btn:hover,.control-btn:focus-visible{border-color:#d7a777;transform:translateY(-1px);outline:none}.control-btn.primary{color:#fff;background:var(--green);border-color:var(--green)}.control-btn.active{background:#fff0dd;border-color:#e6ad77;color:#a95631}.speed{display:flex;align-items:center;gap:10px;margin-left:auto;color:var(--muted);font-size:12px;font-weight:700}.speed input{accent-color:var(--green);width:120px}.hint{width:100%;font-size:12px;color:#9b9c8b;padding-left:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:680px){.page{width:calc(100% - 24px);padding-top:20px}.hero{display:block}.side-note{text-align:left;margin-top:14px}.scene-wrap{border-radius:20px}.controls{gap:9px}.speed{margin-left:0;width:100%;justify-content:space-between}.speed input{flex:1}.title{font-size:42px}}
</style>
</head>
<body>
<main class="page">
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>漫游 · SLOW RIDE</span></div><div class="live"><i></i><span>LIVE SCENERY</span></div></header>
<section class="hero"><div><p class="eyebrow">今日路线 · 湖畔向南</p><h1 class="title">把日子，骑成<br>好风景。</h1><p class="subtitle">风从湖面来，鹧鸪正好踩着一朵云出发。</p></div><p class="side-note">一段会呼吸的<br>小小旅程<br>让时间慢一点。</p></section>
<section class="scene-wrap">
<svg class="scene" viewBox="0 0 1200 680" role="img" aria-labelledby="svg-title svg-desc" xmlns="http://www.w3.org/2000/svg">
<title id="svg-title">鹧鸪在湖畔骑自行车</title><desc id="svg-desc">奶油色天空下，圆润的灰褐色鹧鸪骑着绿色自行车穿过湖畔、山丘、木屋和花草，翅膀会随骑行摆动。</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b9e3df"/><stop offset="1" stop-color="#fff0ce"/></linearGradient><linearGradient id="lake" x2="0" y2="1"><stop stop-color="#70c4bb"/><stop offset="1" stop-color="#b6ddd0"/></linearGradient><linearGradient id="hill" x2="0" y2="1"><stop stop-color="#8db39b"/><stop offset="1" stop-color="#5c937a"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
 <g id="cloud"><ellipse cx="0" cy="0" rx="62" ry="22" fill="#fffdf4" opacity=".86"/><ellipse cx="-35" cy="-11" rx="29" ry="22" fill="#fffdf4"/><ellipse cx="28" cy="-18" rx="37" ry="27" fill="#fffdf4"/></g>
 <g id="flower"><path d="M0 30V0" stroke="#537e55" stroke-width="3"/><circle cy="-4" r="7" fill="#ed8b87"/><circle cx="7" cy="-1" r="6" fill="#f0a1a0"/><circle cx="-7" cy="-1" r="6" fill="#f0a1a0"/><circle r="3" fill="#f6ce67"/></g>
 <g id="wheel"><circle r="76" fill="#fffdf5" fill-opacity=".28" stroke="#405e58" stroke-width="8"/><circle r="7" fill="#405e58"/><g stroke="#61817a" stroke-width="2"><path d="M0-7V-70M0 7V70M-7 0H-70M7 0H70M-5-5L-50-50M5 5L50 50M5-5L50-50M-5 5L-50 50"/></g></g>
</defs>
<rect width="1200" height="680" fill="url(#sky)"/><circle cx="1000" cy="118" r="74" fill="#ffe7a0" opacity=".65"/><circle cx="1000" cy="118" r="44" fill="#fff2be"/>
<g class="clouds"><use href="#cloud" transform="translate(-80 105)"/><use href="#cloud" transform="translate(500 74) scale(.72)"/><use href="#cloud" transform="translate(1050 195) scale(.66)"/></g>
<path d="M0 315 Q155 220 300 300T590 276T870 295T1200 228V395H0Z" fill="#a8c2b4"/><path d="M0 352 Q160 280 340 350T650 322T940 344T1200 295V435H0Z" fill="url(#hill)" opacity=".92"/>
<path d="M0 372 Q170 337 330 370T650 356T940 377T1200 348V560H0Z" fill="url(#lake)"/><g fill="none" stroke="#d8f2df" stroke-width="4" opacity=".62"><path d="M20 410q80-18 160 0t160 0t160 0t160 0t160 0t160 0t160 0"/><path d="M-70 478q100-18 200 0t200 0t200 0t200 0t200 0t200 0t200 0"/><path d="M30 525q70-14 140 0t140 0t140 0t140 0t140 0t140 0t140 0"/></g>
<g transform="translate(170 325)"><path d="M0 95V-5M0 10l-53-40M0 17l58-48M0 3l-5-67" stroke="#6c8c65" stroke-width="7" stroke-linecap="round"/><path d="M-4-59q-35-30-70-24M2-65q26-35 55-34M-2-61q-8-43-1-69M2-60q34-9 63 13" fill="none" stroke="#4c946b" stroke-width="9" stroke-linecap="round"/></g>
<g transform="translate(840 300)"><path d="M0 115V0M0 24l-54-42M2 14l54-46M0 3l0-58" stroke="#6c8c65" stroke-width="6" stroke-linecap="round"/><path d="M0-54q-34-28-64-20M0-57q31-35 59-31M0-57q10-36 9-55M0-56q38-1 61 24" fill="none" stroke="#4c946b" stroke-width="8" stroke-linecap="round"/></g>
<g transform="translate(970 375)"><path d="M0 24h95v-70h-71v70" fill="#f1ba79" stroke="#745e4c" stroke-width="4"/><path d="M-8-46h115L52-94Z" fill="#d87857" stroke="#745e4c" stroke-width="4"/><rect x="15" y="-20" width="19" height="25" fill="#e4f0de" stroke="#745e4c" stroke-width="3"/><rect x="59" y="-20" width="19" height="25" fill="#e4f0de" stroke="#745e4c" stroke-width="3"/></g>
<path d="M0 555 Q200 520 400 550T800 540T1200 552V680H0Z" fill="#77a45c"/><path d="M0 595Q200 562 400 590T800 585T1200 590V680H0Z" fill="#5e8d55" opacity=".82"/>
<path d="M0 561H1200V621H0Z" fill="#ead5a6"/><path d="M0 590H1200" stroke="#fff2ce" stroke-width="3" stroke-dasharray="40 40" id="road"/>
<ellipse cx="602" cy="599" rx="211" ry="13" fill="#4e6948" opacity=".17"/>
<g id="bike" transform="translate(435 512)">
 <use id="rear-wheel" href="#wheel"/><use id="front-wheel" href="#wheel" x="330"/>
 <path d="M0 0L137 0L81-115Z M81-115L266-115L137 0 M258-145L330 0 M81-115L74-143" fill="none" stroke="#315f57" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M0 0L137 0" stroke="#dbbd80" stroke-width="3"/><path d="M50-143h56M257-145l-6-18h34q18 0 12 16" fill="none" stroke="#384d46" stroke-width="9" stroke-linecap="round"/>
 <circle cx="137" r="20" fill="#e5b77b" stroke="#315f57" stroke-width="5"/>
 <path id="far-leg" stroke="#ad593a" stroke-width="8" fill="none" stroke-linecap="round"/>
 <g id="bike-motion" transform="translate(115 -205)">
  <path d="M-73 9L-134-26Q-132 33-67 53" fill="#827368" stroke="#51524a" stroke-width="4"/>
  <ellipse cx="0" cy="8" rx="100" ry="82" fill="#9a8d7c" stroke="#51524a" stroke-width="4"/>
  <ellipse cx="25" cy="29" rx="69" ry="59" fill="#f5e7ca"/>
  <path d="M-37 39l13 30M-14 42l12 33M10 43l11 32M34 43l10 24M57 39l9 17" stroke="#454942" stroke-width="9" stroke-linecap="round"/>
  <path d="M22-30Q-1-91 42-117Q85-133 102-94Q112-58 75-25Q52-6 22-30Z" fill="#f7efd9" stroke="#51524a" stroke-width="4"/>
  <path d="M24-96Q25-129 62-124Q89-119 98-99" fill="#948777"/>
  <path d="M82-82Q66-77 70-50Q49-32 30-46" stroke="#343d37" stroke-width="9" fill="none" stroke-linecap="round"/>
  <circle cx="79" cy="-85" r="7" fill="#263a35"/><circle cx="81" cy="-88" r="2" fill="#fff"/>
  <path d="M99-79l26 11-27 10Z" fill="#c9633e" stroke="#934d36" stroke-width="3"/>
  <g id="bird-wing"><path d="M0-12Q-54-57-85-21Q-112 10-65 37Q-22 61 10 22Q19 4 0-12Z" fill="#81776a" stroke="#51524a" stroke-width="4"/><path d="M-66-18q15 22 42 33M-79-3q14 22 40 28M-49-29q19 24 35 28" fill="none" stroke="#cdbb9c" stroke-width="5" stroke-linecap="round"/></g>
  <path d="M78-36Q110-13 164 36" stroke="#8b806c" stroke-width="9" fill="none" stroke-linecap="round"/>
 </g>
 <path id="near-leg" stroke="#cb6b43" stroke-width="9" fill="none" stroke-linecap="round"/>
 <path id="crank" stroke="#42564a" stroke-width="6" fill="none"/><path id="pedals" stroke="#344c45" stroke-width="7" fill="none" stroke-linecap="round"/>
</g>
<g class="foreground"><use href="#flower" transform="translate(64 628) scale(1.1)"/><use href="#flower" transform="translate(1120 638) scale(.9)"/><use href="#flower" transform="translate(1070 608) scale(.65)"/><path d="M270 660q8-50 17-68M295 660q-4-47-16-68M910 670q12-60 33-88M945 670q-3-43-19-73" stroke="#477b4b" stroke-width="6" fill="none" stroke-linecap="round"/></g>
</svg>
<div class="controls" aria-label="动画控制"><button class="control-btn primary" id="play" type="button" aria-pressed="true">暂停旅程</button><button class="control-btn" id="wing" type="button">挥翅一下</button><button class="control-btn" id="scene" type="button" aria-pressed="false">换个风景</button><label class="speed" for="speed">骑行速度 <input id="speed" type="range" min=".4" max="1.8" step=".1" value="1"><output id="speed-value">1.0×</output></label><div class="hint" id="hint">正在湖畔慢慢前进 · 按空格也可以暂停</div></div>
</section>
</main>
<script>
(() => {
  const $=id=>document.getElementById(id), play=$('play'), wing=$('wing'), scene=$('scene'), speed=$('speed'), output=$('speed-value'), hint=$('hint');
  const svg=document.querySelector('.scene'), ns='http://www.w3.org/2000/svg', layers=[];
  function repeat(node,rate){const wrap=document.createElementNS(ns,'g');node.before(wrap);wrap.append(node);for(const x of [-1200,1200,2400]){const tile=document.createElementNS(ns,'g');tile.setAttribute('transform',`translate(${x} 0)`);tile.append(node.cloneNode(true));wrap.append(tile);}layers.push({node:wrap,rate});}
  const hills=[...svg.children].filter(n=>n.tagName==='path').slice(0,2);
  hills[0].setAttribute('d','M0 315Q150 200 300 315T600 315T900 315T1200 315V435H0Z');
  hills[1].setAttribute('d','M0 350Q150 275 300 350T600 350T900 350T1200 350V435H0Z');
  repeat(document.querySelector('.clouds'),8);repeat(hills[0],13);repeat(hills[1],21);repeat(document.querySelector('.foreground'),108);
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');let running=!reduced.matches,last=null,time=0,boostUntil=0,mode=false;
  function setRunning(next){running=next;play.textContent=running?'暂停旅程':'继续旅程';play.setAttribute('aria-pressed',String(running));hint.textContent=running?'正在湖畔慢慢前进 · 按空格也可以暂停':'旅程已暂停 · 所有动态已冻结';}
  play.addEventListener('click',()=>setRunning(!running));
  wing.addEventListener('click',()=>{boostUntil=time+1800;wing.classList.add('active');hint.textContent=running?'鹧鸪正在向风挥翅':'已准备挥翅 · 继续旅程后开始';});
  scene.addEventListener('click',()=>{mode=!mode;scene.setAttribute('aria-pressed',String(mode));scene.classList.toggle('active',mode);scene.textContent=mode?'回到晴日':'换个风景';$('sky').children[0].setAttribute('stop-color',mode?'#d4b4b4':'#b9e3df');$('sky').children[1].setAttribute('stop-color',mode?'#ffe1aa':'#fff0ce');$('lake').children[0].setAttribute('stop-color',mode?'#8eaaa4':'#70c4bb');hint.textContent=mode?'此刻是温柔的落日时分':'晴日湖畔 · 继续向南';});
  speed.addEventListener('input',()=>output.textContent=Number(speed.value).toFixed(1)+'×');
  document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!e.target.closest('button,input,select,textarea,a,[contenteditable]')){e.preventDefault();setRunning(!running);}});
  reduced.addEventListener('change',e=>{if(e.matches)setRunning(false);});
  function draw(){const angle=time/380,bob=Math.sin(angle*2)*2.5,boost=Math.max(0,Math.min(1,(boostUntil-time)/600));
    $('bike-motion').setAttribute('transform',`translate(115 ${-205+bob})`);
    $('bird-wing').setAttribute('transform',`rotate(${Math.sin(time/(boost?72:235))*(7+boost*28)} 0 -12)`);
    $('rear-wheel').setAttribute('transform',`rotate(${time*.075})`);$('front-wheel').setAttribute('transform',`rotate(${time*.075} 330 0)`);
    const x=137+34*Math.cos(angle),y=34*Math.sin(angle),fx=274-x,fy=-y;
    $('crank').setAttribute('d',`M${x} ${y}L${fx} ${fy}`);$('pedals').setAttribute('d',`M${x-12} ${y}h24M${fx-12} ${fy}h24`);
    $('near-leg').setAttribute('d',`M130 ${-122+bob}Q${x+30} -75 ${x} ${y-4}`);$('far-leg').setAttribute('d',`M110 ${-124+bob}Q${fx-28} -65 ${fx} ${fy-4}`);
    for(const layer of layers)layer.node.setAttribute('transform',`translate(${-((time*.001*layer.rate)%1200)} 0)`);
    $('road').setAttribute('stroke-dashoffset',time*.108%80);
    if(!boost)wing.classList.remove('active');
  }
  function frame(now){const delta=last===null?0:Math.min(50,now-last);last=now;if(running){time+=delta*Number(speed.value);draw();}requestAnimationFrame(frame);}
  setRunning(running);draw();requestAnimationFrame(frame);
})();
</script>
</body></html>
