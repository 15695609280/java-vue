<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹧鸪的海边骑行</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #16324a 0%, #1d5a6e 60%, #2a7d8c 100%);
    padding: 24px;
  }
  svg {
    width: 100%;
    max-width: 1100px;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    display: block;
  }
</style>
</head>
<body>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹧鸪骑自行车在海边公路">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f2"/>
      <stop offset="1" stop-color="#eafbff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cbdd8"/>
      <stop offset="1" stop-color="#2b87b4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset=".6" stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>

    <g id="cloud">
      <ellipse cx="0" cy="0" rx="40" ry="22" fill="#ffffff" opacity=".92"/>
      <ellipse cx="35" cy="-14" rx="32" ry="20" fill="#ffffff" opacity=".92"/>
      <ellipse cx="-30" cy="-10" rx="28" ry="16" fill="#ffffff" opacity=".92"/>
      <ellipse cx="62" cy="2" rx="24" ry="14" fill="#ffffff" opacity=".92"/>
    </g>

    <g id="gull" stroke="#5a6a75" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M0,0 q7,-7 14,0 q7,-7 14,0"/>
    </g>

    <g id="post">
      <rect x="-4" y="448" width="8" height="30" rx="2" fill="#98a4ad"/>
    </g>

    <g id="palm">
      <path d="M0,0 q8,-30 2,-58" stroke="#8a6b4a" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g stroke="#3f8f50" stroke-width="7" fill="none" stroke-linecap="round">
        <path d="M2,-58 q-34,-20 -56,-10"/>
        <path d="M2,-58 q-20,-30 -44,-34"/>
        <path d="M2,-60 q4,-34 18,-46"/>
        <path d="M2,-58 q28,-24 52,-22"/>
        <path d="M2,-58 q32,-8 48,10"/>
      </g>
      <circle cx="-2" cy="-52" r="4" fill="#6b4f35"/>
      <circle cx="6" cy="-50" r="4" fill="#6b4f35"/>
    </g>

    <g id="bush">
      <circle cx="0" cy="0" r="14" fill="#569a58"/>
      <circle cx="-12" cy="4" r="10" fill="#4c8a4e"/>
      <circle cx="12" cy="4" r="10" fill="#63a85f"/>
    </g>

    <g id="fgTile">
      <g stroke="#7d9a56" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M40,655 q-3,-14 -9,-20"/>
        <path d="M44,655 q1,-16 -2,-24"/>
        <path d="M48,655 q6,-13 13,-18"/>
      </g>
      <circle cx="120" cy="668" r="5" fill="#bfa97c"/>
      <circle cx="132" cy="672" r="3.5" fill="#cbb78a"/>
      <g stroke="#8aa05f" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M170,690 q-4,-12 -10,-16"/>
        <path d="M174,690 q0,-15 -3,-21"/>
        <path d="M178,690 q5,-11 12,-15"/>
      </g>
      <line x1="225" y1="630" x2="225" y2="615" stroke="#6d8a4c" stroke-width="3"/>
      <circle cx="225" cy="612" r="5" fill="#e87f9a"/>
      <circle cx="225" cy="612" r="2" fill="#f5d76e"/>
    </g>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(170 115)">
    <circle r="62" fill="url(#sunGlow)"/>
    <g stroke="#ffe9a8" stroke-width="4" stroke-linecap="round" opacity=".85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="120s" repeatCount="indefinite"/>
      <line y1="-50" y2="-70"/><line y1="50" y2="70"/>
      <line x1="-50" x2="-70"/><line x1="50" x2="70"/>
      <line x1="35" y1="35" x2="50" y2="50"/><line x1="-35" y1="-35" x2="-50" y2="-50"/>
      <line x1="35" y1="-35" x2="50" y2="-50"/><line x1="-35" y1="35" x2="-50" y2="50"/>
    </g>
    <circle r="36" fill="#ffef9e"/>
    <circle r="30" fill="#fff6c4"/>
  </g>

  <!-- 云 -->
  <g><animateTransform attributeName="transform" type="translate" from="1400 0" to="-400 0" dur="100s" begin="-20s" repeatCount="indefinite"/>
    <g transform="translate(0 70)"><use href="#cloud"/></g></g>
  <g><animateTransform attributeName="transform" type="translate" from="1400 0" to="-400 0" dur="75s" begin="-55s" repeatCount="indefinite"/>
    <g transform="translate(0 135) scale(1.2)"><use href="#cloud"/></g></g>
  <g><animateTransform attributeName="transform" type="translate" from="1400 0" to="-400 0" dur="120s" begin="-85s" repeatCount="indefinite"/>
    <g transform="translate(0 45) scale(.7)"><use href="#cloud"/></g></g>

  <!-- 海鸥 -->
  <g><animateTransform attributeName="transform" type="translate" from="1300 0" to="-200 0" dur="60s" begin="-10s" repeatCount="indefinite"/>
    <use href="#gull" transform="translate(0 95)"/><use href="#gull" transform="translate(46 82) scale(.8)"/></g>
  <g><animateTransform attributeName="transform" type="translate" from="1300 0" to="-200 0" dur="85s" begin="-50s" repeatCount="indefinite"/>
    <use href="#gull" transform="translate(0 150) scale(.7)"/></g>

  <!-- 远山 / 灯塔 -->
  <path d="M40,320 q90,-34 200,-12 q60,8 140,12 Z" fill="#8fb0c2"/>
  <path d="M700,320 q80,-26 170,-10 q50,10 110,10 Z" fill="#9cb9c9"/>
  <path d="M950,320 q40,-14 90,-6 q30,4 60,6 Z" fill="#8fb0c2"/>
  <g>
    <rect x="994" y="278" width="13" height="34" fill="#f5f2ea"/>
    <rect x="994" y="286" width="13" height="5" fill="#d94f3d"/>
    <rect x="994" y="296" width="13" height="5" fill="#d94f3d"/>
    <path d="M991,278 h19 l-9.5,-11 Z" fill="#3a3f45"/>
    <circle cx="1000.5" cy="270" r="4" fill="#ffe9a8">
      <animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== 大海 ===== -->
  <rect y="320" width="1200" height="115" fill="url(#sea)"/>
  <line x1="0" y1="320" x2="1200" y2="320" stroke="#ffffff" stroke-width="2" opacity=".6"/>

  <g stroke="#ffffff" stroke-width="3" fill="none" opacity=".55">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="6s" repeatCount="indefinite"/>
    <path d="M-160,340 q40,-9 80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0"/>
  </g>
  <g stroke="#dff2f8" stroke-width="4" fill="none" opacity=".5">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-240 0" dur="8s" repeatCount="indefinite"/>
    <path d="M-240,382 q60,-11 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0"/>
  </g>

  <!-- 波光 -->
  <line x1="0" y1="355" x2="1200" y2="355" stroke="#ffffff" stroke-width="2" opacity=".35" stroke-dasharray="30 50">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="7s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="398" x2="1200" y2="398" stroke="#ffffff" stroke-width="2" opacity=".3" stroke-dasharray="24 56">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="9s" repeatCount="indefinite"/>
  </line>

  <!-- 帆船 -->
  <g><animateTransform attributeName="transform" type="translate" from="1300 0" to="-250 0" dur="110s" begin="-40s" repeatCount="indefinite"/>
    <g transform="translate(0 366)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-3 35 8;3 35 8;-3 35 8" dur="4.5s" repeatCount="indefinite"/>
        <path d="M0,0 h70 l-12,16 h-46 Z" fill="#7a4a3a"/>
        <line x1="35" y1="0" x2="35" y2="-48" stroke="#5a3a2e" stroke-width="3"/>
        <path d="M33,-46 L33,-4 L6,-4 Z" fill="#ffffff"/>
        <path d="M38,-40 L38,-4 L62,-4 Z" fill="#f2e6d8"/>
      </g>
    </g>
  </g>

  <!-- ===== 沙滩 ===== -->
  <rect y="430" width="1200" height="25" fill="#efe0b3"/>
  <g stroke="#ffffff" stroke-width="4" fill="none" opacity=".55">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="5s" repeatCount="indefinite"/>
    <path d="M-120,430 q30,-7 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0"/>
  </g>

  <!-- 棕榈树与灌木（沙滩边滚动） -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="3.4s" repeatCount="indefinite"/>
    <use href="#palm" x="-600" y="452"/><use href="#palm" x="0" y="452"/>
    <use href="#palm" x="600" y="452"/><use href="#palm" x="1200" y="452"/>
    <use href="#bush" x="-300" y="448"/><use href="#bush" x="300" y="448"/>
    <use href="#bush" x="900" y="448"/><use href="#bush" x="1500" y="448"/>
  </g>

  <!-- ===== 公路 ===== -->
  <rect y="455" width="1200" height="130" fill="#5b646e"/>
  <line x1="0" y1="456" x2="1200" y2="456" stroke="#8893a0" stroke-width="4"/>
  <line x1="0" y1="583" x2="1200" y2="583" stroke="#4a525a" stroke-width="4"/>
  <rect y="492" width="1200" height="16" fill="#4d555e" opacity=".5"/>
  <rect y="536" width="1200" height="16" fill="#4d555e" opacity=".5"/>

  <!-- 护栏 -->
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#b9c2c9" stroke-width="5"/>
  <line x1="0" y1="462" x2="1200" y2="462" stroke="#b9c2c9" stroke-width="5"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-200 0" dur="1.15s" repeatCount="indefinite"/>
    <use href="#post" x="-200"/><use href="#post" x="0"/><use href="#post" x="200"/>
    <use href="#post" x="400"/><use href="#post" x="600"/><use href="#post" x="800"/>
    <use href="#post" x="1000"/><use href="#post" x="1200"/><use href="#post" x="1400"/>
  </g>

  <!-- 车道虚线 -->
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#f4f4f2" stroke-width="6" stroke-dasharray="42 38">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur=".45s" repeatCount="indefinite"/>
  </line>

  <!-- 车影 -->
  <ellipse cx="575" cy="569" rx="140" ry="9" fill="#000000" opacity=".18">
    <animate attributeName="rx" values="140;132;140" dur=".8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ===== 自行车 + 鹧鸪 ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" keyTimes="0;.5;1" dur=".8s" repeatCount="indefinite"/>

    <!-- 后轮 -->
    <g transform="translate(475 512)">
      <circle r="56" fill="none" stroke="#30353b" stroke-width="10"/>
      <circle r="46" fill="none" stroke="#aeb7bf" stroke-width="4"/>
      <g stroke="#c7cdd3" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.9s" repeatCount="indefinite"/>
        <line x1="-45" y1="0" x2="45" y2="0"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(36)"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(72)"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(108)"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(144)"/>
      </g>
      <circle r="6" fill="#5a6167"/><circle r="2.5" fill="#33383d"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(675 512)">
      <circle r="56" fill="none" stroke="#30353b" stroke-width="10"/>
      <circle r="46" fill="none" stroke="#aeb7bf" stroke-width="4"/>
      <g stroke="#c7cdd3" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.9s" repeatCount="indefinite"/>
        <line x1="-45" y1="0" x2="45" y2="0"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(36)"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(72)"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(108)"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(144)"/>
      </g>
      <circle r="6" fill="#5a6167"/><circle r="2.5" fill="#33383d"/>
    </g>

    <!-- 车架 -->
    <g stroke="#d94f3d" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="475" y1="512" x2="560" y2="522"/>
      <line x1="475" y1="512" x2="529" y2="400"/>
      <line x1="560" y1="522" x2="529" y2="400"/>
      <line x1="560" y1="522" x2="664" y2="444"/>
      <line x1="529" y1="400" x2="650" y2="402"/>
      <line x1="650" y1="402" x2="664" y2="444" stroke-width="8"/>
      <line x1="664" y1="444" x2="675" y2="512" stroke-width="6"/>
    </g>
    <!-- 座垫 / 座管 -->
    <line x1="529" y1="400" x2="521" y2="389" stroke="#8b939b" stroke-width="5"/>
    <ellipse cx="515" cy="387" rx="20" ry="6" fill="#3a3f45" transform="rotate(-6 515 387)"/>
    <!-- 车把 -->
    <line x1="650" y1="402" x2="638" y2="384" stroke="#8b939b" stroke-width="5"/>
    <path d="M638,384 C628,380 620,384 618,392" stroke="#3a3f45" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 链条 / 牙盘 -->
    <line x1="560" y1="509" x2="475" y2="506" stroke="#494f56" stroke-width="2.5"/>
    <line x1="560" y1="535" x2="475" y2="518" stroke="#494f56" stroke-width="2.5"/>
    <circle cx="475" cy="512" r="6" fill="none" stroke="#494f56" stroke-width="3"/>
    <circle cx="560" cy="522" r="14" fill="none" stroke="#3f464d" stroke-width="5"/>

    <!-- 远侧腿（深色） -->
    <path fill="none" stroke="#a53220" stroke-width="8" stroke-linecap="round"
      d="M526,398 Q543,452 530,522">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1"
        values="M526,398 Q543,452 530,522;
                M526,398 Q547,442 539,501;
                M526,398 Q560,439 560,492;
                M526,398 Q568,443 581,501;
                M526,398 Q573,453 590,522;
                M526,398 Q570,464 581,543;
                M526,398 Q562,471 560,552;
                M526,398 Q548,463 539,543;
                M526,398 Q543,452 530,522"/>
    </path>
    <!-- 近侧腿（红腿） -->
    <path fill="none" stroke="#cf4527" stroke-width="9" stroke-linecap="round"
      d="M535,392 Q577,450 590,522">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1"
        values="M535,392 Q577,450 590,522;
                M535,392 Q575,462 581,543;
                M535,392 Q566,468 560,552;
                M535,392 Q553,460 539,543;
                M535,392 Q547,449 530,522;
                M535,392 Q552,440 539,501;
                M535,392 Q564,436 560,492;
                M535,392 Q573,440 581,501;
                M535,392 Q577,450 590,522"/>
    </path>

    <!-- 曲柄 + 脚踏（脚保持水平） -->
    <g transform="translate(560 522)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="30" y2="0" stroke="#3f464d" stroke-width="7" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="-30" y2="0" stroke="#3f464d" stroke-width="7" stroke-linecap="round"/>
        <g transform="translate(30 0)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
            <rect x="-11" y="-4" width="22" height="8" rx="3" fill="#2f353b"/>
            <ellipse cx="0" cy="-7" rx="9" ry="5" fill="#b03524"/>
          </g>
        </g>
        <g transform="translate(-30 0)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
            <rect x="-11" y="-4" width="22" height="8" rx="3" fill="#2f353b"/>
            <ellipse cx="0" cy="-7" rx="8" ry="4.5" fill="#8c281b"/>
          </g>
        </g>
      </g>
      <circle r="5" fill="#33383d"/>
    </g>

    <!-- ===== 鹧鸪身体 ===== -->
    <!-- 尾巴 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 482 318;4 482 318;-5 482 318" dur="1.1s" repeatCount="indefinite"/>
      <rect x="452" y="296" width="13" height="38" rx="6" transform="rotate(-24 458 315)" fill="#6d6156"/>
      <rect x="466" y="290" width="13" height="40" rx="6" transform="rotate(-10 472 310)" fill="#7b6f61"/>
      <rect x="478" y="288" width="13" height="38" rx="6" transform="rotate(4 484 308)" fill="#8a7c6c"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="545" cy="342" rx="74" ry="56" transform="rotate(-6 545 342)" fill="#9c9184"/>
    <ellipse cx="545" cy="318" rx="64" ry="36" fill="#8b8073" opacity=".5"/>
    <ellipse cx="552" cy="362" rx="58" ry="32" fill="#cfc6b4"/>

    <!-- 肋部斑纹 -->
    <g>
      <rect x="494" y="346" width="7" height="24" rx="3" transform="rotate(12 497 358)" fill="#2e2820"/>
      <rect x="512" y="351" width="7" height="25" rx="3" transform="rotate(12 515 363)" fill="#efe5cd"/>
      <rect x="530" y="354" width="7" height="26" rx="3" transform="rotate(12 533 367)" fill="#9e5130"/>
      <rect x="548" y="355" width="7" height="26" rx="3" transform="rotate(12 551 368)" fill="#2e2820"/>
      <rect x="566" y="353" width="7" height="25" rx="3" transform="rotate(12 569 365)" fill="#efe5cd"/>
      <rect x="582" y="348" width="7" height="23" rx="3" transform="rotate(12 585 359)" fill="#9e5130"/>
    </g>

    <!-- 颈部 -->
    <ellipse cx="592" cy="302" rx="22" ry="20" fill="#9c9184"/>

    <!-- 翅膀（前伸扶把） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 588 318;-4 588 318;0 588 318" dur="1.6s" repeatCount="indefinite"/>
      <path d="M588,318 C612,334 622,360 620,388" stroke="#8b8073" stroke-width="13" fill="none" stroke-linecap="round"/>
      <circle cx="620" cy="386" r="6.5" fill="#8b8073"/>
    </g>
    <!-- 收拢的翅羽 -->
    <ellipse cx="530" cy="336" rx="42" ry="25" transform="rotate(-14 530 336)" fill="#877b6b"/>
    <path d="M498,330 q30,6 64,4" stroke="#6e6252" stroke-width="3" fill="none"/>
    <path d="M502,342 q28,6 58,2" stroke="#6e6252" stroke-width="3" fill="none"/>

    <!-- 头 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 600 300;2 600 300;0 600 300" dur="1.6s" repeatCount="indefinite"/>
      <circle cx="612" cy="282" r="27" fill="#a29681"/>
      <ellipse cx="604" cy="293" rx="16" ry="12" fill="#f4ecd9"/>
      <path d="M632,274 Q627,291 611,298 Q595,298 591,288" stroke="#221f1c" stroke-width="6.5" fill="none" stroke-linecap="round"/>
      <path d="M636,275 L654,282 L637,289 Z" fill="#d8402f"/>
      <circle cx="616" cy="272" r="7" stroke="#d8402f" stroke-width="1.6" fill="none"/>
      <circle cx="616" cy="272" r="3.6" fill="#1c1c1c"/>
      <circle cx="617" cy="271" r="1.2" fill="#ffffff"/>
    </g>

    <!-- 围巾 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="6 598 309;-8 598 309;6 598 309" dur=".9s" repeatCount="indefinite"/>
      <path d="M598,306 C582,312 566,306 548,312 L552,318 C568,312 584,318 598,312 Z" fill="#e8574a"/>
      <ellipse cx="598" cy="308" rx="6" ry="5.5" fill="#d8402f"/>
    </g>

    <!-- 车筐 + 花 -->
    <g>
      <line x1="650" y1="392" x2="644" y2="384" stroke="#a87c46" stroke-width="3"/>
